name: Configurator Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: fileinfo
          coverage: none
      - name: PHP syntax
        run: |
          set -e
          find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          set -e
          find assets/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Required files
        run: |
          test -f index.html
          test -f backend/bootstrap.php
          test -f backend/api/auth.php
          test -f backend/api/projects.php
          test -f backend/api/media.php
          test -f backend/storage/.htaccess
